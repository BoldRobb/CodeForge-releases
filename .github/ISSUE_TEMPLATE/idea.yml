name: Sugerir una mejora
description: Algo que te gustaría que la app hiciera o hiciera distinto.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Qué te gustaría
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Para qué te serviría
      description: El problema que resuelve, o en qué momento del día lo echas de menos.
